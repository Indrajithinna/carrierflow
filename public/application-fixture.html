<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Careerflow — Test application form</title><style>body{font:16px system-ui;max-width:580px;margin:50px auto;padding:20px;color:#234c37}label{display:block;margin:20px 0}input,textarea,select{display:block;padding:12px;width:100%;box-sizing:border-box;border:1px solid #bdd0c2;border-radius:8px;margin-top:8px}button{padding:12px 18px;border:0;background:#145c46;color:white;border-radius:8px}p{line-height:1.7}</style></head><body><h1>Example application form</h1><p>A local testing fixture. This form never submits data to an employer.</p><form><label>Full name<input name="name" autocomplete="name"></label><label>Email<input type="email" name="email" autocomplete="email"></label><label>Expected salary<input name="salary"></label><label>Resume<input type="file" name="resume"></label><label>Date of birth<input type="date" name="dob"></label><label>Tell us about yourself<textarea name="summary"></textarea></label><button type="submit">Test submission</button><p id="result" role="status"></p></form><script>document.querySelector("form").addEventListener("submit",e=>{e.preventDefault();document.getElementById("result").textContent="Test form submitted locally. No external application was sent.";});</script></body></html>
